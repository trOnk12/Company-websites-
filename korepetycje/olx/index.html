<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Połączenie z OLX</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231B1F24'/><text x='16' y='21.5' font-family='Georgia,serif' font-size='14' font-weight='700' fill='%23F6F3EC' text-anchor='middle'>MP</text></svg>">
<style>body{font:18px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#faf7ef;color:#203834}code{display:block;padding:.8rem;background:#fff;border:1px solid #bac6bb;word-break:break-all}</style></head>
<body><h1>Połączenie z OLX</h1>
<p id="msg">Ta strona odbiera jednorazowy kod z OLX po zalogowaniu. Nic tu nie jest zapisywane.</p>
<code id="code" hidden></code>
<script>
const p = new URLSearchParams(location.search), c = p.get('code');
if (c) { document.getElementById('msg').textContent = 'Skopiuj ten kod i uruchom: node scripts/publish-tutoring.mjs olx-token <kod> (kod jest ważny krótko).'; const e = document.getElementById('code'); e.textContent = c; e.hidden = false; }
else if (p.get('error')) document.getElementById('msg').textContent = 'OLX zwrócił błąd: ' + p.get('error');
</script></body></html>
