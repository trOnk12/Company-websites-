<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">How much traffic arrives after a concert?</title>
<g class="step s1"><rect class="d-paper" x="26" y="42" width="250" height="94" rx="11"/><text class="d-b" x="151" y="97" text-anchor="middle">120k drivers</text></g>

<g class="step s2"><rect class="d-paper" x="349" y="42" width="250" height="94" rx="11"/><text class="d-b" x="474" y="97" text-anchor="middle">1.2m reads</text></g>

<ol class="caps">
<li><p>Multiply drivers by ten reads each.</p></li>
<li><p>The daily total hides the concert rush.</p></li>

</ol>
