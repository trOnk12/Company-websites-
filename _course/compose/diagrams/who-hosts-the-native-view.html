<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">Which side hosts the other?</title>
<g class="step s1"><rect class="d-paper" x="36" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="93" y="184" text-anchor="middle">iOS app</text></g>
<g class="step s2"><rect class="d-paper" x="187" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="244" y="184" text-anchor="middle">Screen host</text></g>

<g class="step s3"><rect class="d-paper" x="338" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="395" y="184" text-anchor="middle">Shared screen</text></g>

<g class="step s4"><rect class="d-hl" x="489" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="546" y="184" text-anchor="middle">Apple field</text></g>

<g data-move="1:93,241 2:244,241 3:395,241 4:546,241"><circle class="d-acc" r="7"/></g>

<ol class="caps">
<li><p>An existing iOS app owns the navigation around bookmarks.</p></li>
<li><p>Its navigation presents a controller which hosts the shared UI.</p></li>
<li><p>Compose arranges the contents inside that controller.</p></li>
<li><p>The shared region can in turn host one native text field.</p></li>
</ol>
