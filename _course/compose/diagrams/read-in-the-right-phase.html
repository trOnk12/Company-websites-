<!-- label: Which work does a moving card need? -->
<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">Which work does a moving card need?</title>
<g class="step s1"><rect class="d-paper" x="36" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="93" y="184" text-anchor="middle">State changes</text></g>
<g class="step s2"><rect class="d-paper" x="187" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="244" y="184" text-anchor="middle">Read in phase</text></g>
<x-arrow class="step s2" tone="acc" d="M154,179 H180"/>
<g class="step s3"><rect class="d-paper" x="338" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="395" y="184" text-anchor="middle">Placement</text></g>
<x-arrow class="step s3" tone="acc" d="M305,179 H331"/>
<g class="step s4"><rect class="d-hl" x="489" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="546" y="184" text-anchor="middle">Paint position</text></g>
<x-arrow class="step s4" tone="acc" d="M456,179 H482"/>
<g data-move="1:93,241 2:244,241 3:395,241 4:546,241"><circle class="d-acc" r="7"/></g>
</svg>
<ol class="caps">
<li><p>The scroll position changes. The text and size stay constant.</p></li>
<li><p>Compose tracks the phase that reads the position.</p></li>
<li><p>Placement reads the new offset and moves the existing card.</p></li>
<li><p>The card appears at its new position. This update can reuse the composition.</p></li>
</ol>
