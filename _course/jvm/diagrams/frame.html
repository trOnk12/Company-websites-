<!-- label: What does a method receive? -->
<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">What does a method receive?</title>
<g class="step s1"><rect class="d-paper" x="36" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="93" y="184" text-anchor="middle">Local 7</text></g>
<g class="step s2"><rect class="d-paper" x="187" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="244" y="184" text-anchor="middle">Stack 7, 1</text></g>
<x-arrow class="step s2" tone="acc" d="M154,179 H180"/>
<g class="step s3"><rect class="d-paper" x="338" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="395" y="184" text-anchor="middle">Stack 8</text></g>
<x-arrow class="step s3" tone="acc" d="M305,179 H331"/>
<g class="step s4"><rect class="d-hl" x="489" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="546" y="184" text-anchor="middle">Return 8</text></g>
<x-arrow class="step s4" tone="acc" d="M456,179 H482"/>
<g data-move="1:93,241 2:244,241 3:395,241 4:546,241"><circle class="d-acc" r="7"/></g>
</svg>
<ol class="caps">
<li><p>The called method receives a copy of seven.</p></li>
<li><p>The load and constant instructions supply two inputs.</p></li>
<li><p>Addition replaces both inputs with one result.</p></li>
<li><p>The result returns to the caller.</p></li>
</ol>
