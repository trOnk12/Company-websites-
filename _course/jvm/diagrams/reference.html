<!-- label: Why do both names read eight? -->
<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">Why do both names read eight?</title>
<g class="step s1"><rect class="d-paper" x="36" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="93" y="184" text-anchor="middle">First</text></g>
<g class="step s2"><rect class="d-paper" x="187" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="244" y="184" text-anchor="middle">Alias</text></g>
<x-arrow class="step s2" tone="acc" d="M154,179 H180"/>
<g class="step s3"><rect class="d-paper" x="338" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="395" y="184" text-anchor="middle">Write 8</text></g>
<x-arrow class="step s3" tone="acc" d="M305,179 H331"/>
<g class="step s4"><rect class="d-hl" x="489" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="546" y="184" text-anchor="middle">Rebind local</text></g>
<x-arrow class="step s4" tone="acc" d="M456,179 H482"/>
<g data-move="1:93,241 2:244,241 3:395,241 4:546,241"><circle class="d-acc" r="7"/></g>
</svg>
<ol class="caps">
<li><p>The caller has a reference to a counter.</p></li>
<li><p>The second name reaches the same counter.</p></li>
<li><p>Writing through the parameter updates that object.</p></li>
<li><p>Reassigning the parameter leaves the caller pointing at the original.</p></li>
</ol>
