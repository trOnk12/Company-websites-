<ol class="caps">
<li><p>A build captures the program and its runtime.</p></li>
<li><p>The process starts with a read-only container filesystem.</p></li>
<li><p>The named volume supplies writable storage.</p></li>
<li><p>A database write needs room for its journal.</p></li>
</ol>
