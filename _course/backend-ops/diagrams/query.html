<svg viewBox="0 0 640 380" role="img" aria-labelledby="d-title"><title id="d-title">Why does the same page cost less to read?</title>
<g class="step s1"><rect class="d-paper" x="36" y="141" width="114" height="76" rx="9"/><text class="d-tiny" x="93" y="184" text-anchor="middle">Filter owner</text></g>

<li><p>The query selects one owner.</p></li>
